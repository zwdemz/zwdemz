name: Update profile statistics

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics and rank
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=transparent&locale=cn
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent&locale=cn
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: E982EAB1BDFD9A22C2FDEFD42B7861028ACF9439
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: zwdemz
          git_committer_email: 73386299+zwdemz@users.noreply.github.com

      - name: Commit refreshed cards
        run: |
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore(profile): update GitHub stats"
          git push
